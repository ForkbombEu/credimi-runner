name: 🚀 Release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    name: 📦 Build and publish binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure git auth for private Go modules
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CREDIMI_EXTRA_PAT:-}" ]; then
            echo "CREDIMI_EXTRA_PAT is not set"
            exit 1
          fi
          git config --global url."https://${CREDIMI_EXTRA_PAT}@github.com/".insteadOf "https://github.com/"
          go env -w GOPRIVATE=github.com/forkbombeu/*
        env:
          CREDIMI_EXTRA_PAT: ${{ secrets.CREDIMI_EXTRA_PAT }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup git auth
        if: always()
        shell: bash
        run: |
          git config --global --unset-all url."https://${CREDIMI_EXTRA_PAT}@github.com/".insteadOf || true
        env:
          CREDIMI_EXTRA_PAT: ${{ secrets.CREDIMI_EXTRA_PAT }}
