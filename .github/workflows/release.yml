name: Test and release
on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

permissions:
  contents: read
  packages: write

env:
  CREDIMI_EXTRA_PAT: ${{ secrets.CREDIMI_EXTRA_PAT }}
  DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  go-test:
    name: ☔ coverage
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure git auth for private Go modules
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CREDIMI_EXTRA_PAT:-}" ]; then
            echo "CREDIMI_EXTRA_PAT is not set"
            exit 1
          fi
          git config --global url."https://${CREDIMI_EXTRA_PAT}@github.com/".insteadOf "https://github.com/"
          go env -w GOPRIVATE=github.com/forkbombeu/*

      - name: Run tests with coverage gate (85%)
        shell: bash
        run: |
          set -euo pipefail
          go generate ./...
          PKGS="$(go list ./... | grep -v '/pkg/gen' | grep -v '/pkg/design' | tr '\n' ' ')"
          go test -tags=credimi_extra ${PKGS} -covermode=atomic -coverprofile=coverage.out
          go tool cover -func=coverage.out | awk -v min="85" '/^total:/ { gsub("%","",$3); printf("Total coverage: %s%% (required: >%s%%)\n", $3, min); if (($3 + 0) <= (min + 0)) exit 1 }'

      - name: Cleanup git auth
        if: always()
        shell: bash
        run: |
          git config --global --unset-all url."https://${CREDIMI_EXTRA_PAT}@github.com/".insteadof || true

  darwin-native-test:
    name: 🍎 native runtime
    runs-on: macos-latest
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure git auth for private Go modules
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CREDIMI_EXTRA_PAT:-}" ]; then
            echo "CREDIMI_EXTRA_PAT is not set"
            exit 1
          fi
          git config --global url."https://${CREDIMI_EXTRA_PAT}@github.com/".insteadOf "https://github.com/"
          go env -w GOPRIVATE=github.com/forkbombeu/*

      - name: Run native supervisor tests
        shell: bash
        run: |
          set -euo pipefail
          go generate ./...
          go test -tags=credimi_extra ./cmd -run 'NativeRuntimeSupervisor|NativeRuntime'

      - name: Cleanup git auth
        if: always()
        shell: bash
        run: |
          git config --global --unset-all url."https://${CREDIMI_EXTRA_PAT}@github.com/".insteadof || true

  semantic-release:
    name: 🤖 release
    needs: go-test
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure git auth for private Go modules
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CREDIMI_EXTRA_PAT:-}" ]; then
            echo "CREDIMI_EXTRA_PAT is not set"
            exit 1
          fi
          git config --global url."https://${CREDIMI_EXTRA_PAT}@github.com/".insteadOf "https://github.com/"
          go env -w GOPRIVATE=github.com/forkbombeu/*

      - name: Generate Goa code
        shell: bash
        run: go generate ./...

      - name: Release & build binaries
        uses: go-semantic-release/action@v1
        id: release
        with:
          hooks: goreleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest binary artifacts
        if: steps.release.outputs.release_created == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/credimi-runner-*

      - name: Cleanup git auth
        if: always()
        shell: bash
        run: |
          git config --global --unset-all url."https://${CREDIMI_EXTRA_PAT}@github.com/".insteadOf || true

  publish_docker_image:
    name: 🚢 docker
    needs: semantic-release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (optional)
        if: env.DOCKERHUB_NAMESPACE != '' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/credimi-runner
          tags: |
            type=raw,value=latest
            type=sha

      - name: Extract Docker metadata for Docker Hub (optional)
        id: meta_dockerhub
        if: env.DOCKERHUB_NAMESPACE != '' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ env.DOCKERHUB_NAMESPACE }}/credimi-runner
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push unified runner image
        uses: docker/build-push-action@v6
        id: push
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ needs.semantic-release.outputs.release_created == 'true' && needs.semantic-release.outputs.tag || format('main-{0}', github.sha) }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.meta_dockerhub.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secret-envs: |
            credimi_extra_pat=CREDIMI_EXTRA_PAT

      - name: Attest Docker image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/credimi-runner
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Trigger Coolify deploy
        if: success()
        shell: bash
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_WEBHOOK_TOKEN: ${{ secrets.COOLIFY_WEBHOOK_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${COOLIFY_WEBHOOK_URL:-}" || -z "${COOLIFY_WEBHOOK_TOKEN:-}" ]]; then
            echo "Coolify webhook secrets are not set; skipping deploy trigger."
            exit 0
          fi
          curl -fsS --request GET "${COOLIFY_WEBHOOK_URL}" \
            --header "Authorization: Bearer ${COOLIFY_WEBHOOK_TOKEN}"
