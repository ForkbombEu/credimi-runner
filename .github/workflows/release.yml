name: 📢 Tests, Release & Publish
on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

permissions:
  contents: read
  packages: write

env:
  CREDIMI_EXTRA_PAT: ${{ secrets.CREDIMI_EXTRA_PAT }}

jobs:
  go-test:
    name: ✅ Go tests with coverage gate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure git auth for private Go modules
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CREDIMI_EXTRA_PAT:-}" ]; then
            echo "CREDIMI_EXTRA_PAT is not set"
            exit 1
          fi
          git config --global url."https://${CREDIMI_EXTRA_PAT}@github.com/".insteadOf "https://github.com/"
          go env -w GOPRIVATE=github.com/forkbombeu/*

      - name: Run tests with coverage gate (90%)
        shell: bash
        run: |
          set -euo pipefail
          go generate ./...
          PKGS="$(go list ./... | grep -v '/pkg/gen' | grep -v '/pkg/design' | tr '\n' ' ')"
          go test ${PKGS} -covermode=atomic -coverprofile=coverage.out
          go tool cover -func=coverage.out | awk -v min="90" '/^total:/ { gsub("%","",$3); printf("Total coverage: %s%% (required: %s%%)\n", $3, min); if (($3 + 0) < (min + 0)) exit 1 }'

      - name: Cleanup git auth
        if: always()
        shell: bash
        run: |
          git config --global --unset-all url."https://${CREDIMI_EXTRA_PAT}@github.com/".insteadof || true

  semantic-release:
    name: 🤖 Semantic release
    needs: go-test
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: 🛠️ Prepare pnpm workspace
        uses: dyne/pnpm@main
        with:
          node-version: 20
          fetch-depth: 0
      - run: pnpm semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish_docker_image:
    name: 🐳 Publish Docker image
    needs: semantic-release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: phone
            platforms: linux/amd64,linux/arm64
          - target: emulator
            platforms: linux/amd64
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (${{ matrix.target }})
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/credimi-runner-${{ matrix.target }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push (${{ matrix.target }})
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          platforms: ${{ matrix.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secret-envs: |
            credimi_extra_pat=CREDIMI_EXTRA_PAT

      - name: Trigger Coolify deploy (emulator)
        if: success() && matrix.target == 'emulator' && secrets.COOLIFY_WEBHOOK_URL != '' && secrets.COOLIFY_WEBHOOK_TOKEN != ''
        shell: bash
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_WEBHOOK_TOKEN: ${{ secrets.COOLIFY_WEBHOOK_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS --request GET "${COOLIFY_WEBHOOK_URL}" \
            --header "Authorization: Bearer ${COOLIFY_WEBHOOK_TOKEN}"
