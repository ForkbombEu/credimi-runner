services:
  runner:
    image: ${RUNNER_IMAGE:-ghcr.io/forkbombeu/credimi-runner-phone:latest}
    restart: unless-stopped
    profiles: ["phone"]
    env_file:
      - .env
    volumes:
      - ./pkg/server/docs:/src/pkg/server/docs:ro
      - ./pkg/gen/http:/src/pkg/gen/http:ro
    ports:
      - "127.0.0.1:8050:8050"
    expose:
      - "8050"
    labels:
      caddy: "${RUNNER_CADDY_SITE:-:80}"
      caddy.reverse_proxy: "{{upstreams 8050}}"
    networks:
      - ingress
  
  runner_emulator:
    image: ${LOCAL_IMAGE:-ghcr.io/forkbombeu/credimi-runner-emulator:latest}
    restart: unless-stopped
    profiles: ["emulator"]
    devices:
      - /dev/kvm:/dev/kvm
    env_file:
      - .env
    environment:
      CREDIMI_URL: ${CREDIMI_URL:-https://credimi.io}
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal.credimi.io:7233}
      ADB_VENDOR_KEYS: /root/.android
      BASE_NAME: ${BASE_NAME:-credimi}
      GOLDEN_PATH: ${GOLDEN_PATH:-/avd-golden/credimi-golden}
    volumes:
      - ${ANDROID_KEYS_DIR:-/home/puria/.android}:/root/.android
      - ${HOST_AVD_HOME_PATH:-/srv/credimi/avd-home}:/avd-home
      - ${HOST_AVD_GOLDEN_PATH:-/srv/credimi/avd-golden}:/avd-golden
      - ./pkg/server/docs:/src/pkg/server/docs:ro
      - ./pkg/gen/http:/src/pkg/gen/http:ro
    network_mode: host

  runner_host:
    image: alpine:3.21
    restart: unless-stopped
    profiles: ["local"]
    command:
      - /bin/sh
      - -c
      - "trap : TERM INT; while true; do sleep 3600; done"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      caddy: "${RUNNER_CADDY_SITE:-:80}"
      caddy.reverse_proxy: "host.docker.internal:${RUNNER_PORT:-8050}"
    networks:
      - ingress

  caddy:
    image: lucaslorentz/caddy-docker-proxy:2.9-alpine
    restart: unless-stopped
    environment:
      CADDY_INGRESS_NETWORKS: ${CADDY_INGRESS_NETWORKS:-credimi-runner-ingress}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - ingress

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://caddy:80
    depends_on:
      - caddy
    networks:
      - ingress

  tunnel_named:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - caddy
    profiles:
      - named
    networks:
      - ingress

networks:
  ingress:
    name: ${CADDY_INGRESS_NETWORKS:-credimi-runner-ingress}

volumes:
  caddy_data:
  caddy_config:
