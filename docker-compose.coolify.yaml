services:
  runner_emulator:
    image: ghcr.io/forkbombeu/credimi-runner-emulator:latest
    pull_policy: always
    restart: unless-stopped
    privileged: true
    cpuset: "${CPUSET:-3-6}"
    cpus: "${CPUS:-4.0}"

    ulimits:
      nofile:
        soft: 65535
        hard: 65535

    devices:
      - /dev/kvm:/dev/kvm

    volumes:
      - type: bind
        source: "${CREDIMI_RUNNER_ENV_FILE:-./.env}"
        target: /app/.env
        read_only: true
      - type: bind
        source: "${CREDIMI_AVD_HOME_PATH:-/srv/credimi/avd-home}"
        target: /avd-home
      - type: bind
        source: "${CREDIMI_AVD_GOLDEN_PATH:-/srv/credimi/avd-golden}"
        target: /avd-golden

    environment:
      QEMU_AUDIO_DRV: none
      CREDIMI_URL: ${CREDIMI_URL:?https://credimi.io}
      CREDIMI_INTERNAL_ADMIN_KEY: ${CREDIMI_INTERNAL_ADMIN_KEY:?}
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:?temporal.credimi.io:7233}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-credimi-runner}     
      CREDIMI_RUNNER_ID: ${CREDIMI_RUNNER_ID:?}
      CREDIMI_RUNNER_CONFIG_DIR: /app
      ADB_PRIVATE_KEY: ${ADB_PRIVATE_KEY:?}
      ADB_PUBLIC_KEY: ${ADB_PUBLIC_KEY:?}
      PORT: ${PORT:-8060}
