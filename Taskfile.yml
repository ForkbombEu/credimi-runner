version: "3"

vars:
  APP_NAME: credimi-runner
  BIN_DIR: bin
  BIN_PATH: "./{{.BIN_DIR}}/{{.APP_NAME}}"
  BUILD_VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  BUILD_TIME:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ
  COVERAGE_FILE: coverage.out
  COVERAGE_MIN: "85"
  GO_TAGS: credimi_extra
  LOCAL_DOCKER_IMAGE: credimi-runner:local
  GO_LDFLAGS: >-
    -s -w
    -X github.com/forkbombeu/credimi-runner/internal/buildinfo.Version={{.BUILD_VERSION}}
    -X github.com/forkbombeu/credimi-runner/internal/buildinfo.BuildTime={{.BUILD_TIME}}

tasks:
  build:
    desc: Build the native Credimi Runner binary locally
    deps: ["go:gen"]
    sources:
      - main.go
      - go.mod
      - go.sum
      - cmd/**/*.go
      - internal/**/*.go
      - pkg/**/*.go
    generates:
      - "{{.BIN_DIR}}/{{.APP_NAME}}"
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - >-
        go build -tags=credimi_extra
        -ldflags "{{.GO_LDFLAGS}}"
        -o {{.BIN_PATH}}
        .

  "docker:build-local":
    desc: Build the unified local runner image with a BuildKit secret
    cmds:
      - >-
        test -n "${CREDIMI_EXTRA_PAT:-}" ||
        (echo "CREDIMI_EXTRA_PAT is required to build the local runner image" >&2; exit 1)
      - >-
        docker build
        --secret id=credimi_extra_pat,env=CREDIMI_EXTRA_PAT
        -t {{.LOCAL_DOCKER_IMAGE}}
        .

  "docker:coolify:build-local":
    desc: Build and tag the unified image for local Coolify-style testing
    cmds:
      - task docker:build-local
      - docker tag {{.LOCAL_DOCKER_IMAGE}} ghcr.io/forkbombeu/credimi-runner:latest

  "docker:coolify:up-local":
    desc: Start the local Coolify-style emulator runner and leave it running
    deps: ["docker:coolify:build-local"]
    cmds:
      - |
        set -euo pipefail
        command -v docker >/dev/null || { echo "Docker is required" >&2; exit 1; }
        docker info >/dev/null
        docker_arch="$(docker info 2>/dev/null | awk '/Architecture:/ {print $2; exit}')"; case "$docker_arch" in amd64|x86_64) ;; *) echo "local Coolify testing requires an amd64/x86_64 Docker daemon (found: $docker_arch)" >&2; exit 1 ;; esac
        test -r /dev/kvm && test -w /dev/kvm || { echo "/dev/kvm must exist and be readable and writable" >&2; exit 1; }
        for key in CREDIMI_URL CREDIMI_INTERNAL_ADMIN_KEY TEMPORAL_ADDRESS CREDIMI_RUNNER_ID CREDIMI_DEVICE_ID BASE_NAME GOLDEN_PATH ADB_PRIVATE_KEY ADB_PUBLIC_KEY PORT COOLIFY_URL; do
          test -n "${!key:-}" || { echo "$key is required" >&2; exit 1; }
        done
        test -d "${HOST_AVD_HOME_PATH:-/srv/credimi/avd-home}" || { echo "HOST_AVD_HOME_PATH must name an existing directory" >&2; exit 1; }
        test -d "${HOST_AVD_GOLDEN_PATH:-/srv/credimi/avd-golden}" || { echo "HOST_AVD_GOLDEN_PATH must name an existing directory" >&2; exit 1; }
        echo "Warning: successful startup will register/update ${CREDIMI_RUNNER_ID} and ${CREDIMI_DEVICE_ID} against ${CREDIMI_URL}."
        docker compose -p credimi-runner-coolify-local -f docker-compose.coolify.yaml -f docker-compose.coolify.local.yaml config >/dev/null
        docker compose -p credimi-runner-coolify-local -f docker-compose.coolify.yaml -f docker-compose.coolify.local.yaml up --detach --force-recreate --pull never runner_emulator
        printf '\nCoolify-style runner is running.\n\nFollow logs:\n  task docker:coolify:logs\n\nCheck health from host:\n  curl %s/health\n\nCheck readiness from host:\n  curl %s/readyz\n\nInspect directly:\n  docker compose -p credimi-runner-coolify-local -f docker-compose.coolify.yaml -f docker-compose.coolify.local.yaml exec runner_emulator bash\n\nStop:\n  task docker:coolify:down\n' "${COOLIFY_URL%%,*}" "${COOLIFY_URL%%,*}"

  "docker:coolify:logs":
    desc: Follow local Coolify-style runner logs
    cmds:
      - docker compose -p credimi-runner-coolify-local -f docker-compose.coolify.yaml -f docker-compose.coolify.local.yaml logs -f --tail=200 runner_emulator

  "docker:coolify:down":
    desc: Stop and remove the local Coolify-style test stack without volumes
    cmds:
      - docker compose -p credimi-runner-coolify-local -f docker-compose.coolify.yaml -f docker-compose.coolify.local.yaml down

  format:
    desc: Format Go code
    cmds:
      - go fmt ./...

  lint:
    desc: Run all linting checks
    cmds:
      - task: lint:format
      - task: lint:design

  "lint:format":
    desc: Check Go formatting
    cmds:
      - >-
        test -z "$(gofmt -l .)" || (echo "gofmt: files need formatting:" && gofmt -l . && exit 1)

  "lint:design":
    desc: Validate DESIGN.md when present
    cmds:
      - if [ -f DESIGN.md ]; then npx --yes @google/design.md lint DESIGN.md; fi

  "go:gen":
    internal: true
    desc: Run Goa generation
    sources:
      - pkg/design/**/*.go
      - go.mod
      - go.sum
    generates:
      - pkg/gen/**/*.go
    cmds:
      - go generate ./...

  test:
    desc: Run tests with strict aggregate coverage (> {{.COVERAGE_MIN}}%)
    deps: ["go:gen"]
    vars:
      TEST_PKGS:
        sh: go list ./... | grep -v '/pkg/gen' | grep -v '/pkg/design' | tr '\n' ' '
    cmds:
      - go test -tags={{.GO_TAGS}} {{.TEST_PKGS}} -covermode=atomic -coverprofile={{.COVERAGE_FILE}}
      - >-
        go tool cover -func={{.COVERAGE_FILE}} |
        awk -v min="{{.COVERAGE_MIN}}" '/^total:/ { gsub("%","",$3); printf("Total coverage: %s%% (required: > %s%%)\n", $3, min); if (($3 + 0) <= (min + 0)) exit 1 }'

  "test:race":
    desc: Run all non-generated tests with the race detector
    deps: ["go:gen"]
    vars:
      TEST_PKGS:
        sh: go list ./... | grep -v '/pkg/gen' | grep -v '/pkg/design' | tr '\n' ' '
    cmds:
      - go test -tags={{.GO_TAGS}} -race {{.TEST_PKGS}}

  clean:
    desc: Remove generated Go code and local build artifacts
    cmds:
      - rm -rf pkg/gen {{.BIN_DIR}} {{.COVERAGE_FILE}}
